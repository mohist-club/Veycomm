name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: |
          chmod +x Scripts/make-app.sh Scripts/make-dmg.sh
          Scripts/make-app.sh
      - name: Create DMG
        run: Scripts/make-dmg.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/Veycomm.dmg --generate-notes
