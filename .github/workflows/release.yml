name: Verify source

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build source
        run: |
          DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer swift build --disable-sandbox
